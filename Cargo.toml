[package]
name = "zellij-agent-attention"
version = "0.4.2"
edition = "2021"
license = "MIT"

[lib]
name = "zellij_agent_attention"
path = "src/lib.rs"

[[bin]]
name = "zellij-agent-attention"
path = "src/main.rs"

[dependencies]
zellij-tile = "0.44.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
